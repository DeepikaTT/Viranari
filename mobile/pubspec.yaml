name: viranari_app
description: ViraNari v1.8.7 clean emergency actions, India 112 access, and bundled launcher icon.
publish_to: 'none'
version: 1.8.7+47

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.5.0
  geolocator: ^14.0.2
  flutter_secure_storage: ^9.2.4
  uuid: ^4.5.1
  intl: ^0.20.2
  battery_plus: ^7.1.1
  connectivity_plus: ^7.3.1
  url_launcher: ^6.3.2
  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  flutter_compass: ^0.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
